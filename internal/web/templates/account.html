{{define "setup"}}
<p>{{t .Settings.Locale "setup_intro"}}</p>
<form method="post" action="/setup">
  <label for="email">{{t .Settings.Locale "email"}}</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">{{t .Settings.Locale "password"}}</label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <button type="submit">{{t .Settings.Locale "create_account"}}</button>
</form>
{{end}}
{{define "login"}}
<form method="post" action="/login">
  <label for="email">{{t .Settings.Locale "email"}}</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">{{t .Settings.Locale "password"}}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">{{t .Settings.Locale "login"}}</button>
</form>
{{end}}
