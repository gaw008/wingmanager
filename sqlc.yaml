version: "2"
sql:
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/auth/queries.sql
    gen:
      go:
        package: auth
        out: internal/auth
        omit_unused_structs: true
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/settings/queries.sql
    gen:
      go:
        package: settings
        out: internal/settings
        omit_unused_structs: true
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/property/queries.sql
    gen:
      go:
        package: property
        out: internal/property
        omit_unused_structs: true
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/person/queries.sql
    gen:
      go:
        package: person
        out: internal/person
        omit_unused_structs: true
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/booking/queries.sql
    gen:
      go:
        package: booking
        out: internal/booking
        omit_unused_structs: true
        rename:
          booking: bookingRecord
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/task/queries.sql
    gen:
      go:
        package: task
        out: internal/task
        omit_unused_structs: true
        rename:
          task: taskRecord
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/ical/queries.sql
    gen:
      go:
        package: ical
        out: internal/ical
        omit_unused_structs: true
        rename:
          calendar_feed: feedRecord
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/lease/queries.sql
    gen:
      go:
        package: lease
        out: internal/lease
        omit_unused_structs: true
        rename:
          lease: leaseRecord
          ledger_entry: entryRecord
  - engine: sqlite
    schema: internal/db/migrations
    queries: internal/ledger/queries.sql
    gen:
      go:
        package: ledger
        out: internal/ledger
        omit_unused_structs: true
        rename:
          lease: leaseRecord
          ledger_entry: entryRecord
